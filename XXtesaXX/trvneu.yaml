blueprint:
  name: Heizungssteuerung TRV mit manueller Override
  description: Steuert ein Thermostat mit Zeitplan und manueller Überschreibung
  domain: automation
  input:
    trv:
      name: Thermostat (TRV)
      selector:
        entity:
          filter:
            - domain: climate
    
    schedule_entity:
      name: Zeitplan
      selector:
        entity:
          filter:
            - domain: schedule
    
    comfort_helper:
      name: Comfort-Temperatur Helper
      selector:
        entity:
          filter:
            - domain: input_number
    
    eco_helper:
      name: Eco-Temperatur Helper
      selector:
        entity:
          filter:
            - domain: input_number
    
    trv_schedule_text:
      name: TRV Schedule Text Entity
      default: []
      selector:
        entity:
          filter:
            - domain: text
          multiple: true
    
    summer_mode:
      name: Sommermodus
      default: []
      selector:
        entity:
          filter:
            - domain: input_boolean
    
    summer_temp:
      name: Sommer-Temperatur
      default: 5
      selector:
        number:
          min: 5
          max: 15
          step: 0.5
          unit_of_measurement: "°C"
    
    window_sensors:
      name: Fensterkontakte
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: window
          multiple: true
    
    window_open_temp:
      name: Fenster-offen-Temperatur
      default: 5
      selector:
        number:
          min: 5
          max: 15
          step: 0.5
          unit_of_measurement: "°C"
    
    presence_entity:
      name: Anwesenheit
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
    
    away_temp:
      name: Abwesenheits-Temperatur
      default: 16
      selector:
        number:
          min: 5
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
    
    boost_entity:
      name: Boost-Funktion
      default: []
      selector:
        entity:
          filter:
            - domain: input_boolean
    
    boost_temp:
      name: Boost-Temperatur
      default: 25
      selector:
        number:
          min: 20
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    
    accept_manual_setpoint:
      name: Manuelle Änderungen akzeptieren
      default: true
      selector:
        boolean:
    
    manual_override_duration:
      name: Dauer der manuellen Überschreibung
      default: 2
      selector:
        number:
          min: 0.5
          max: 12
          step: 0.5
          unit_of_measurement: "h"
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input schedule_entity
    id: schedule
  - platform: state
    entity_id: !input comfort_helper
    id: comfort_temp
  - platform: state
    entity_id: !input eco_helper
    id: eco_temp
  - platform: state
    entity_id: !input summer_mode
    id: summer
  - platform: state
    entity_id: !input window_sensors
    id: window
  - platform: state
    entity_id: !input presence_entity
    id: presence
  - platform: state
    entity_id: !input boost_entity
    id: boost
  - platform: state
    entity_id: !input trv
    attribute: temperature
    id: manual_setpoint
  - platform: homeassistant
    event: start
    id: startup

variables:
  trv: !input trv
  schedule_entity: !input schedule_entity
  comfort_helper: !input comfort_helper
  eco_helper: !input eco_helper
  trv_schedule_texts: !input trv_schedule_text
  summer_mode_entity: !input summer_mode
  summer_temp: !input summer_temp
  window_sensors: !input window_sensors
  window_open_temp: !input window_open_temp
  presence_entity: !input presence_entity
  away_temp: !input away_temp
  boost_entity: !input boost_entity
  boost_temp: !input boost_temp
  accept_manual_setpoint: !input accept_manual_setpoint
  manual_override_duration: !input manual_override_duration

action:
  - repeat:
      for_each: "{{ trv_schedule_texts }}"
      sequence:
        - service: text.set_value
          target:
            entity_id: "{{ repeat.item }}"
          data:
            value: ""
  
  - if:
      - condition: trigger
        id: manual_setpoint
      - condition: template
        value_template: "{{ accept_manual_setpoint }}"
      - condition: template
        value_template: "{{ trigger.to_state.attributes.temperature != trigger.from_state.attributes.temperature }}"
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id == none }}"
    then:
      - service: system_log.write
        data:
          message: "TRV {{ trv }}: Manuelle Änderung erkannt. Override für {{ manual_override_duration }}h aktiv."
          level: info
      - delay:
          hours: "{{ manual_override_duration }}"
      - service: climate.set_temperature
        target:
          entity_id: "{{ trv }}"
        data:
          temperature: >-
            {% if is_state(schedule_entity, 'on') %}
              {{ states(comfort_helper) | float }}
            {% else %}
              {{ states(eco_helper) | float }}
            {% endif %}
      - stop: "Override abgelaufen"
  
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ boost_entity | length > 0 }}"
          - condition: state
            entity_id: !input boost_entity
            state: "on"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ boost_temp }}"
      
      - conditions:
          - condition: template
            value_template: "{{ summer_mode_entity | length > 0 }}"
          - condition: state
            entity_id: !input summer_mode
            state: "on"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ summer_temp }}"
      
      - conditions:
          - condition: template
            value_template: "{{ window_sensors | length > 0 }}"
          - condition: template
            value_template: "{{ expand(window_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ window_open_temp }}"
      
      - conditions:
          - condition: template
            value_template: "{{ presence_entity | length > 0 }}"
          - condition: state
            entity_id: !input presence_entity
            state: "off"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ away_temp }}"
      
      - conditions:
          - condition: state
            entity_id: !input schedule_entity
            state: "on"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ states(comfort_helper) | float }}"
    
    default:
      - service: climate.set_temperature
        target:
          entity_id: !input trv
        data:
          temperature: "{{ states(eco_helper) | float }}"