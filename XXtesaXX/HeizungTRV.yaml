blueprint:
  name: Heizungssteuerung TRV mit manueller Override-Funktion
  description: >-
    Steuert ein Thermostat (TRV) basierend auf einem Zeitplan mit Comfort/Eco-Temperaturen.
    
    **NEU:** Manuelle Änderungen am TRV werden temporär übernommen und nach einstellbarer Zeit 
    automatisch auf den ursprünglichen Wert zurückgesetzt.
    
    Features:
    - Sommer-/Wintermodus
    - Fensterkontakte
    - Anwesenheitserkennung
    - Boost-Funktion
    - **Temporäre manuelle Überschreibung**
  domain: automation
  input:
    trv:
      name: Thermostat (TRV)
      description: Das zu steuernde Thermostat
      selector:
        entity:
          filter:
            - domain: climate
    
    schedule_entity:
      name: Zeitplan
      description: Schedule-Entity (on = Comfort, off = Eco)
      selector:
        entity:
          filter:
            - domain: schedule
    
    comfort_helper:
      name: Comfort-Temperatur Helper
      description: Input Number für Comfort-Temperatur
      selector:
        entity:
          filter:
            - domain: input_number
    
    eco_helper:
      name: Eco-Temperatur Helper
      description: Input Number für Eco-Temperatur
      selector:
        entity:
          filter:
            - domain: input_number
    
    trv_schedule_text:
      name: TRV Schedule Text Entity
      description: Text-Entity für TRV-eigenen Zeitplan (wird deaktiviert)
      default: []
      selector:
        entity:
          filter:
            - domain: text
          multiple: true
    
    summer_mode:
      name: Sommermodus
      description: Input Boolean für Sommermodus (Heizung aus)
      default: []
      selector:
        entity:
          filter:
            - domain: input_boolean
    
    summer_temp:
      name: Sommer-Temperatur
      description: Zieltemperatur im Sommermodus
      default: 5
      selector:
        number:
          min: 5
          max: 15
          step: 0.5
          unit_of_measurement: "°C"
    
    window_sensors:
      name: Fensterkontakte
      description: Fensterkontakte (bei offen -> Heizung aus)
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: window
          multiple: true
    
    window_open_temp:
      name: Fenster-offen-Temperatur
      description: Zieltemperatur bei geöffnetem Fenster
      default: 5
      selector:
        number:
          min: 5
          max: 15
          step: 0.5
          unit_of_measurement: "°C"
    
    presence_entity:
      name: Anwesenheit
      description: Entity für Anwesenheitserkennung (optional)
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
    
    away_temp:
      name: Abwesenheits-Temperatur
      description: Zieltemperatur bei Abwesenheit
      default: 16
      selector:
        number:
          min: 5
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
    
    boost_entity:
      name: Boost-Funktion
      description: Input Boolean für Boost-Modus (optional)
      default: []
      selector:
        entity:
          filter:
            - domain: input_boolean
    
    boost_temp:
      name: Boost-Temperatur
      description: Zieltemperatur im Boost-Modus
      default: 25
      selector:
        number:
          min: 20
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    
    accept_manual_setpoint:
      name: Manuelle Änderungen akzeptieren
      description: Erlaube temporäre manuelle Änderungen am TRV
      default: true
      selector:
        boolean:
    
    manual_override_duration:
      name: Dauer der manuellen Überschreibung
      description: Nach dieser Zeit wird der ursprüngliche Wert wiederhergestellt
      default: 2
      selector:
        number:
          min: 0.5
          max: 12
          step: 0.5
          unit_of_measurement: "h"
          mode: slider
    
    # NEU: Helper-Entities als Input
    manual_override_active:
      name: Override Status Helper
      description: Input Boolean für Override-Status (z.B. input_boolean.trv_wohnzimmer_manual_override_active)
      selector:
        entity:
          filter:
            - domain: input_boolean
    
    manual_override_time:
      name: Override Zeitstempel Helper
      description: Input DateTime für Override-Zeitstempel (z.B. input_datetime.trv_wohnzimmer_manual_override_time)
      selector:
        entity:
          filter:
            - domain: input_datetime
    
    original_setpoint:
      name: Original Sollwert Helper
      description: Input Number für Original-Sollwert (z.B. input_number.trv_wohnzimmer_original_setpoint)
      selector:
        entity:
          filter:
            - domain: input_number

mode: restart
max_exceeded: silent

trigger:
  # Zeitplan ändert sich
  - platform: state
    entity_id: !input schedule_entity
    id: schedule
  
  # Comfort-Temperatur ändert sich
  - platform: state
    entity_id: !input comfort_helper
    id: comfort_temp
  
  # Eco-Temperatur ändert sich
  - platform: state
    entity_id: !input eco_helper
    id: eco_temp
  
  # Sommermodus ändert sich
  - platform: state
    entity_id: !input summer_mode
    id: summer
  
  # Fensterkontakt ändert sich
  - platform: state
    entity_id: !input window_sensors
    id: window
  
  # Anwesenheit ändert sich
  - platform: state
    entity_id: !input presence_entity
    id: presence
  
  # Boost ändert sich
  - platform: state
    entity_id: !input boost_entity
    id: boost
  
  # Manuelle Änderung am TRV
  - platform: state
    entity_id: !input trv
    attribute: temperature
    id: manual_setpoint
  
  # Home Assistant Start
  - platform: homeassistant
    event: start
    id: startup
  
  # Manueller Override-Timer (alle 5 Minuten prüfen)
  - platform: time_pattern
    minutes: "/5"
    id: check_override_timer

variables:
  trv: !input trv
  schedule_entity: !input schedule_entity
  comfort_helper: !input comfort_helper
  eco_helper: !input eco_helper
  trv_schedule_texts: !input trv_schedule_text
  summer_mode_entity: !input summer_mode
  summer_temp: !input summer_temp
  window_sensors: !input window_sensors
  window_open_temp: !input window_open_temp
  presence_entity: !input presence_entity
  away_temp: !input away_temp
  boost_entity: !input boost_entity
  boost_temp: !input boost_temp
  accept_manual_setpoint: !input accept_manual_setpoint
  manual_override_duration: !input manual_override_duration
  
  # Helper-Entities aus Input
  manual_override_active_entity: !input manual_override_active
  manual_override_time_entity: !input manual_override_time
  original_setpoint_entity: !input original_setpoint
  
  # Prüfe ob Override abgelaufen ist
  override_expired: >-
    {% if is_state(manual_override_active_entity, 'on') %}
      {% set override_time = states(manual_override_time_entity) %}
      {% if override_time not in ['unknown', 'unavailable', ''] %}
        {% set elapsed_hours = (as_timestamp(now()) - as_timestamp(override_time)) / 3600 %}
        {{ elapsed_hours >= (manual_override_duration | float(2)) }}
      {% else %}
        false
      {% endif %}
    {% else %}
      false
    {% endif %}

action:
  # TRV-eigenen Zeitplan deaktivieren
  - repeat:
      for_each: "{{ trv_schedule_texts }}"
      sequence:
        - service: text.set_value
          target:
            entity_id: "{{ repeat.item }}"
          data:
            value: ""
  
  # ========================================
  # MANUELLE ÜBERSCHREIBUNGS-LOGIK
  # ========================================
  
  - choose:
      # ----------------------------------------
      # Fall 1: Override-Timer abgelaufen
      # ----------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ override_expired }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ manual_override_active_entity }}"
          - service: system_log.write
            data:
              message: >-
                TRV {{ trv }}: Manuelle Überschreibung nach {{ manual_override_duration }}h abgelaufen.
                Stelle ursprünglichen Wert wieder her.
              level: info
      
      # ----------------------------------------
      # Fall 2: Manuelle Änderung am TRV erkannt
      # ----------------------------------------
      - conditions:
          - condition: trigger
            id: manual_setpoint
          - condition: template
            value_template: "{{ accept_manual_setpoint }}"
          - condition: template
            value_template: >-
              {{ trigger.to_state.attributes.temperature != trigger.from_state.attributes.temperature }}
          - condition: template
            value_template: >-
              {{ trigger.to_state.context.user_id == none and 
                 trigger.to_state.context.parent_id == none }}
        sequence:
          # Aktuellen Soll-Wert speichern (vor manueller Änderung)
          - service: input_number.set_value
            target:
              entity_id: "{{ original_setpoint_entity }}"
            data:
              value: >-
                {% if is_state(schedule_entity, 'on') %}
                  {{ states(comfort_helper) | float }}
                {% else %}
                  {{ states(eco_helper) | float }}
                {% endif %}
          
          # Override aktivieren
          - service: input_boolean.turn_on
            target:
              entity_id: "{{ manual_override_active_entity }}"
          
          # Zeitstempel setzen
          - service: input_datetime.set_datetime
            target:
              entity_id: "{{ manual_override_time_entity }}"
            data:
              datetime: "{{ now().isoformat() }}"
          
          - service: system_log.write
            data:
              message: >-
                TRV {{ trv }}: Manuelle Änderung erkannt 
                ({{ trigger.from_state.attributes.temperature }}°C -> {{ trigger.to_state.attributes.temperature }}°C).
                Override für {{ manual_override_duration }}h aktiv.
                Original-Wert: {{ states(original_setpoint_entity) }}°C
              level: info
          
          # Automation beenden - TRV-Wert bleibt wie manuell eingestellt
          - stop: "Manuelle Überschreibung aktiv - keine weitere Aktion"
      
      # ----------------------------------------
      # Fall 3: Zeitplan-Änderung während Override
      # ----------------------------------------
      - conditions:
          - condition: trigger
            id: schedule
          - condition: template
            value_template: "{{ is_state(manual_override_active_entity, 'on') }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ manual_override_active_entity }}"
          - service: system_log.write
            data:
              message: >-
                TRV {{ trv }}: Zeitplanänderung erkannt ({{ states(schedule_entity) }}), 
                Override vorzeitig beendet
              level: info
  
  # ========================================
  # NORMALE HEIZUNGSSTEUERUNGS-LOGIK
  # ========================================
  
  # Nur ausführen wenn KEIN Override aktiv ist
  - condition: template
    value_template: "{{ is_state(manual_override_active_entity, 'off') }}"
  
  - choose:
      # ----------------------------------------
      # Priorität 1: Boost-Modus
      # ----------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ boost_entity | length > 0 }}"
          - condition: state
            entity_id: !input boost_entity
            state: "on"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ boost_temp }}"
          - service: system_log.write
            data:
              message: "TRV {{ trv }}: Boost-Modus aktiv ({{ boost_temp }}°C)"
              level: info
      
      # ----------------------------------------
      # Priorität 2: Sommermodus
      # ----------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ summer_mode_entity | length > 0 }}"
          - condition: state
            entity_id: !input summer_mode
            state: "on"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ summer_temp }}"
          - service: system_log.write
            data:
              message: "TRV {{ trv }}: Sommermodus aktiv ({{ summer_temp }}°C)"
              level: info
      
      # ----------------------------------------
      # Priorität 3: Fenster offen
      # ----------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ window_sensors | length > 0 }}"
          - condition: template
            value_template: >-
              {{ expand(window_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ window_open_temp }}"
          - service: system_log.write
            data:
              message: "TRV {{ trv }}: Fenster offen ({{ window_open_temp }}°C)"
              level: info
      
      # ----------------------------------------
      # Priorität 4: Abwesend
      # ----------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ presence_entity | length > 0 }}"
          - condition: state
            entity_id: !input presence_entity
            state: "off"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ away_temp }}"
          - service: system_log.write
            data:
              message: "TRV {{ trv }}: Abwesend ({{ away_temp }}°C)"
              level: info
      
      # ----------------------------------------
      # Priorität 5: Normaler Zeitplan (Comfort/Eco)
      # ----------------------------------------
      - conditions:
          - condition: state
            entity_id: !input schedule_entity
            state: "on"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input trv
            data:
              temperature: "{{ states(comfort_helper) | float }}"
          - service: system_log.write
            data:
              message: "TRV {{ trv }}: Comfort-Modus ({{ states(comfort_helper) }}°C)"
              level: info
    
    # ----------------------------------------
    # Default: Eco-Modus
    # ----------------------------------------
    default:
      - service: climate.set_temperature
        target:
          entity_id: !input trv
        data:
          temperature: "{{ states(eco_helper) | float }}"
      - service: system_log.write
        data:
          message: "TRV {{ trv }}: Eco-Modus ({{ states(eco_helper) }}°C)"
          level: info
